<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rackmap</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar" id="bar" hidden>
    <div class="brand"><span class="mark" aria-hidden="true"></span>rackmap</div>
    <nav class="nav" aria-label="Sections">
      <button type="button" id="nav-racks" aria-current="page">Racks</button>
      <button type="button" id="nav-discovery">Discovery <span class="badge" id="nav-badge" hidden></span></button>
    </nav>
    <div class="who">
      <span id="who-name"></span>
      <button class="link" id="sign-out" type="button">Sign out</button>
    </div>
  </header>

  <main id="main" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <template id="t-setup">
    <section class="card narrow">
      <div class="brand big"><span class="mark" aria-hidden="true"></span>rackmap</div>
      <h1>Create the administrator account</h1>
      <p class="hint">This is the first time rackmap has been opened. The account you create here is the only one that can sign in.</p>
      <form id="form" novalidate>
        <label>Name<input name="name" autocomplete="username" required maxlength="64" autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="256"></label>
        <label>Password again<input name="confirm" type="password" autocomplete="new-password" required maxlength="256"></label>
        <p class="hint">At least 10 characters.</p>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit" class="primary">Create account</button>
      </form>
    </section>
  </template>

  <template id="t-login">
    <section class="card narrow">
      <div class="brand big"><span class="mark" aria-hidden="true"></span>rackmap</div>
      <h1>Sign in</h1>
      <form id="form" novalidate>
        <label>Name<input name="name" autocomplete="username" required maxlength="64" autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>
  </template>

  <template id="t-home">
    <section class="home">
      <div class="toolbar">
        <div class="tabs" id="rack-tabs" role="tablist" aria-label="Racks"></div>
        <div class="actions">
          <button type="button" class="secondary" id="add-rack">Add rack</button>
          <button type="button" class="primary" id="add-device">Add equipment</button>
        </div>
      </div>

      <div class="empty card" id="no-racks" hidden>
        <h1>No racks yet</h1>
        <p class="hint">Add your first rack, then place equipment in it. Equipment that doesn't live in a rack can be recorded too.</p>
        <button type="button" class="primary" id="add-first-rack">Add a rack</button>
      </div>

      <div class="workspace" id="workspace" hidden>
        <div class="rack-col">
          <div class="rack-head">
            <div>
              <h1 id="rack-name"></h1>
              <p class="hint" id="rack-sub"></p>
            </div>
            <div class="rack-tools">
              <div class="seg" role="group" aria-label="Side of the rack shown">
                <button type="button" id="face-front" aria-pressed="true">Front</button>
                <button type="button" id="face-rear" aria-pressed="false">Rear</button>
              </div>
              <button type="button" class="link" id="edit-rack">Edit rack</button>
            </div>
          </div>
          <div class="rack-wrap">
            <div class="rack" id="rack">
              <ol class="units" id="units" aria-hidden="true"></ol>
              <div class="bay" id="bay"></div>
              <ol class="labels" id="labels"></ol>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="card" id="detail" hidden></section>
          <section class="card" id="unplaced">
            <h2>Not in a rack</h2>
            <ul class="plain" id="unplaced-list"></ul>
            <p class="hint" id="unplaced-none">Everything recorded is in a rack.</p>
          </section>
        </aside>
      </div>
      <p class="foot">rackmap <span id="version"></span> · equipment database from the NetBox community device-type library (CC0)</p>
    </section>
  </template>

  <template id="t-discovery">
    <section class="home discovery">
      <div class="disc-grid">
        <section class="card" id="scan-card">
          <h1>Find equipment on the network</h1>
          <p class="hint">rackmap checks every address on the networks you list and shows what answers. Nothing is added until you add it.</p>
          <form id="scan-form" novalidate>
            <label>Networks to scan
              <textarea name="networks" rows="3" placeholder="192.168.1.0/24" spellcheck="false" autocomplete="off"></textarea>
            </label>
            <p class="hint" id="net-suggest" hidden></p>
            <details id="router-box">
              <summary>Ask the router for hardware addresses (optional)</summary>
              <p class="hint">rackmap can only see hardware addresses, and so makers, for devices on its own network. If your router has SNMP switched on, it can supply them for every network.</p>
              <div class="row">
                <label>Router address<input name="router" maxlength="64" placeholder="192.168.1.1" inputmode="decimal" autocomplete="off"></label>
                <label>SNMP community<input name="community" type="password" maxlength="64" autocomplete="off" placeholder="public"></label>
              </div>
              <p class="hint" id="community-note" hidden>A community is saved. Leave the box empty to keep it.</p>
            </details>
            <p class="error" id="scan-error" role="alert" hidden></p>
            <div class="buttons">
              <button type="submit" class="primary" id="scan-go">Scan now</button>
              <span class="hint" id="scan-status" role="status"></span>
            </div>
            <progress id="scan-progress" max="100" value="0" hidden></progress>
          </form>
        </section>

        <section id="found">
          <div class="found-head">
            <h1 id="found-title">Nothing found yet</h1>
            <label class="check"><input type="checkbox" id="show-ignored"> Show ignored</label>
          </div>
          <p class="hint" id="found-empty">Run a scan to see what is on your network.</p>
          <h2 id="h-new" hidden>New</h2>
          <ul class="hosts" id="hosts-new"></ul>
          <h2 id="h-known" hidden>Already recorded</h2>
          <ul class="hosts" id="hosts-known"></ul>
          <h2 id="h-ignored" hidden>Ignored</h2>
          <ul class="hosts" id="hosts-ignored"></ul>
        </section>
      </div>
      <p class="foot">rackmap <span id="version"></span> · maker names from the IEEE address registry</p>
    </section>
  </template>

  <dialog id="rack-dialog">
    <form method="dialog" id="rack-form" novalidate>
      <h1 id="rack-dialog-title">Add rack</h1>
      <label>Name<input name="name" maxlength="80" required placeholder="Garage rack"></label>
      <label>Height in rack units (U)<input name="height_u" type="number" min="1" max="60" step="1" required value="42" inputmode="numeric"></label>
      <label>Notes<textarea name="notes" maxlength="2000" rows="2"></textarea></label>
      <p class="error" id="rack-error" role="alert" hidden></p>
      <div class="buttons">
        <button type="button" class="danger" id="rack-delete" hidden>Delete rack</button>
        <span class="spacer"></span>
        <button type="button" class="secondary" data-close>Cancel</button>
        <button type="submit" class="primary" id="rack-save">Save rack</button>
      </div>
    </form>
  </dialog>

  <dialog id="device-dialog">
    <form method="dialog" id="device-form" novalidate>
      <h1 id="device-dialog-title">Add equipment</h1>

      <fieldset id="model-picker">
        <legend>Model</legend>
        <div id="model-search">
          <label>Search the equipment database<input id="model-q" type="search" placeholder="e.g. CRS328, PowerEdge R720, UniFi 24" autocomplete="off"></label>
          <ul class="results" id="model-results"></ul>
          <button type="button" class="link" id="model-manual">It isn't listed — enter it by hand</button>
        </div>
        <div id="model-chosen" hidden>
          <p class="chosen"><strong id="chosen-name"></strong> <span class="hint" id="chosen-meta"></span></p>
          <button type="button" class="link" id="model-change">Choose a different model</button>
        </div>
        <div id="model-custom" hidden>
          <div class="row">
            <label>Maker<input name="manufacturer" maxlength="120"></label>
            <label>Model<input name="model" maxlength="160"></label>
          </div>
          <div class="row">
            <label>Height (U)<input name="u_height" type="number" min="0" max="60" step="0.5" value="1" inputmode="decimal"></label>
            <label>Depth<select name="full_depth"><option value="true">Full depth</option><option value="false">Half depth</option></select></label>
          </div>
          <p class="hint">Use height 0 for equipment that doesn't mount in a rack.</p>
          <button type="button" class="link" id="model-back">Search the database instead</button>
        </div>
      </fieldset>

      <label>Name<input name="name" maxlength="120" placeholder="What you call it"></label>

      <fieldset>
        <legend>Where it sits</legend>
        <div class="row">
          <label>Rack<select name="rack_id" id="f-rack"></select></label>
          <label>Side<select name="face" id="f-face"><option value="front">Front</option><option value="rear">Rear</option></select></label>
        </div>
        <label id="f-pos-label">Position (lowest U it occupies)<select name="position_u" id="f-pos"></select></label>
        <p class="hint" id="f-pos-hint" hidden></p>
      </fieldset>

      <details id="more">
        <summary>Addresses and notes</summary>
        <div class="row">
          <label>IP address<input name="ip" maxlength="64" inputmode="url" autocomplete="off"></label>
          <label>MAC address<input name="mac" maxlength="32" autocomplete="off"></label>
        </div>
        <div class="row">
          <label>Serial number<input name="serial" maxlength="80" autocomplete="off"></label>
          <label>Admin page<input name="admin_url" maxlength="300" placeholder="https://…" inputmode="url" autocomplete="off"></label>
        </div>
        <label>Notes<textarea name="notes" maxlength="4000" rows="3"></textarea></label>
      </details>

      <p class="error" id="device-error" role="alert" hidden></p>
      <div class="buttons">
        <span class="spacer"></span>
        <button type="button" class="secondary" data-close>Cancel</button>
        <button type="submit" class="primary" id="device-save">Add equipment</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h1 id="confirm-title"></h1>
      <p id="confirm-text"></p>
      <div class="buttons">
        <span class="spacer"></span>
        <button type="button" class="secondary" data-close>Cancel</button>
        <button type="submit" class="danger" id="confirm-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <script src="/static/faceplate.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
